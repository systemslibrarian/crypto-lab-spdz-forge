name: CI (pull requests)

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (Vitest, incl. KATs and adversarial paths)
        run: npm test
      - name: Focused Off-Key mutation gate
        run: npm run test:mutations
      - name: Build (typecheck gates the build)
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests (behavior + dark-theme axe gate at desktop and narrow widths)
        run: npm run test:a11y

  # Dependabot only. Every update, including an ungrouped major, can merge only
  # after this lab's full unit, build, behavior and accessibility gate passes.
  dependabot-auto-merge:
    needs: validate
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write   # required by the deploy dispatch; without it gh workflow run 403s
    steps:
      - id: bump
        name: Read the bump type from the pull request itself
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        # No third-party action in the merge path, and no API read either: the
        # versions come from the pull request's own text, which the triggering
        # event already carries, judged by an in-repo script that answers
        # major / non-major / unknown. Only non-major merges; unknown waits
        # for a person, which is what a grouped pull request with no versions, a
        # retitled one, or a missing body all come to.
        #
        # The title and body are ATTACKER-CONTROLLED, so they reach the script
        # only through env and are never interpolated into this script. A ${{ }}
        # in a `run:` block is substituted before bash reads the line, so a
        # crafted title would become shell source; an env value is data to bash
        # and never source. This is also why the two API reads are gone rather
        # than merely quoted: the payload already carries the text, so the read
        # cannot fail at all -- and the deploy dispatch rides in this same job.
        # The hub's tools/dispatch-sync.js greps this job for a PR re-query,
        # because one used to stand in front of the dispatch; with the reads
        # removed there is nothing left for it to distrust. Naming that call
        # here would re-trigger the grep, which is why this comment does not
        # spell it.
        #
        # The payload also closes a latent hole. An absent body came back from
        # the read as the literal text "null", which is not empty, so the
        # script's empty-body guard never fired; no versions parsed out of
        # "null", the title alone decided, and an empty-bodied pull request
        # could merge on its title. The payload yields an empty string for an
        # absent body, which correctly answers unknown and waits for a person.
        run: |
          set -eu
          node .github/scripts/bump-type.mjs | tee -a "$GITHUB_OUTPUT"
      - name: Merge any bump whose gate went green
        if: steps.bump.outputs.bump == 'non-major'
        # Retry: a sibling PR merging first moves main underneath us and GitHub
        # rejects with "Base branch was modified". That is benign, so try again
        # rather than failing the run over a race.
        run: |
          merged=""
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              merged=1
              break
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          if [ -z "$merged" ]; then
            echo "::warning::gate passed but the merge did not land after 3 attempts;"
            echo "::warning::leaving this PR open - Dependabot will rebase and retry."
            exit 0
          fi
          # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
          # them so workflows cannot retrigger themselves -- so deploy would never run
          # and the site would keep serving the previous build. Ask for it explicitly;
          # a workflow_dispatch through the API is not suppressed. The dispatched run
          # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
